<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrepreneur Directory — Doorstep Incubation Protocol</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <script src="dip-network.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .tab-btn.active { background:#f59e0b; color:#1e293b; border-color:#f59e0b; }
    .vendor-type-btn.active { background:#1e293b; color:white; border-color:#1e293b; }
    .card-anim { animation: slideUp .3s ease-out; }
    @keyframes slideUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    .modal-bg { animation: fadeIn .2s ease; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">

  <div id="nav-placeholder"></div>

  <main class="container mx-auto px-4 py-10 max-w-6xl">

    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
      <div>
        <h1 class="text-3xl font-bold text-slate-900">Network Directory</h1>
        <p class="text-slate-500 mt-1">Entrepreneurs and vendors in the Doorstep Incubation Protocol.</p>
      </div>
      <a href="field-agent.html" class="bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold py-2.5 px-5 rounded-xl text-sm transition-all shrink-0">+ Add Entrepreneur</a>
    </div>

    <!-- Stats Bar -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8">
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 text-center">
        <div id="d-total" class="text-2xl font-black text-slate-900">—</div>
        <div class="text-xs text-slate-400 mt-0.5">Total Entrepreneurs</div>
      </div>
      <div class="bg-amber-50 rounded-2xl p-4 shadow-sm border border-amber-100 text-center">
        <div id="d-pending" class="text-2xl font-black text-amber-600">—</div>
        <div class="text-xs text-slate-400 mt-0.5">Pending Match</div>
      </div>
      <div class="bg-purple-50 rounded-2xl p-4 shadow-sm border border-purple-100 text-center">
        <div id="d-incubating" class="text-2xl font-black text-purple-600">—</div>
        <div class="text-xs text-slate-400 mt-0.5">In Incubation</div>
      </div>
      <div class="bg-green-50 rounded-2xl p-4 shadow-sm border border-green-100 text-center">
        <div id="d-graduated" class="text-2xl font-black text-green-600">—</div>
        <div class="text-xs text-slate-400 mt-0.5">Graduated</div>
      </div>
    </div>

    <!-- Main Tabs -->
    <div class="flex gap-2 mb-6 overflow-x-auto pb-1">
      <button class="tab-btn active px-5 py-2.5 rounded-xl font-semibold text-sm border border-transparent shrink-0 transition-all" onclick="switchMainTab('entrepreneurs', this)">
        👥 Entrepreneurs (<span id="tab-count-e">0</span>)
      </button>
      <button class="tab-btn px-5 py-2.5 rounded-xl font-semibold text-sm border border-slate-200 bg-white text-slate-600 shrink-0 transition-all" onclick="switchMainTab('vendors', this)">
        🏪 Vendor Network (<span id="tab-count-v">0</span>)
      </button>
    </div>

    <!-- ────── ENTREPRENEURS PANEL ────── -->
    <div id="panel-entrepreneurs">
      <!-- Filters -->
      <div class="flex flex-col sm:flex-row gap-3 mb-6">
        <input id="search-e" type="text" placeholder="Search by name, location, or business..."
          oninput="filterEntrepreneurs()"
          class="flex-grow border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-amber-400 focus:outline-none bg-white" />
        <select id="filter-sector" onchange="filterEntrepreneurs()"
          class="border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-amber-400 focus:outline-none bg-white">
          <option value="">All Sectors</option>
          <option value="textiles">Textiles & Weaving</option>
          <option value="food">Food Processing</option>
          <option value="beverages">Beverages</option>
          <option value="agriculture">Agriculture</option>
          <option value="handicrafts">Handicrafts</option>
          <option value="services">Services</option>
          <option value="livestock">Livestock</option>
          <option value="education">Education</option>
        </select>
        <select id="filter-status" onchange="filterEntrepreneurs()"
          class="border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-amber-400 focus:outline-none bg-white">
          <option value="">All Statuses</option>
          <option value="pending-match">Pending Match</option>
          <option value="matched">Matched</option>
          <option value="in-incubation">In Incubation</option>
          <option value="graduated">Graduated</option>
        </select>
      </div>

      <div id="e-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      <div id="e-empty" class="hidden text-center py-16 text-slate-400">
        <p class="text-4xl mb-3">🔍</p>
        <p class="font-semibold text-slate-600 mb-1">No entrepreneurs found</p>
        <p class="text-sm">Try adjusting your filters, or <a href="field-agent.html" class="text-amber-600 underline">add a new entrepreneur</a>.</p>
      </div>
    </div>

    <!-- ────── VENDORS PANEL ────── -->
    <div id="panel-vendors" class="hidden">
      <!-- Filters -->
      <div class="flex flex-col sm:flex-row gap-3 mb-6">
        <input id="search-v" type="text" placeholder="Search vendors by name, capability, or sector..."
          oninput="filterVendors()"
          class="flex-grow border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-amber-400 focus:outline-none bg-white" />
        <div class="flex gap-2 flex-wrap">
          <button class="vendor-type-btn active text-xs px-3 py-2 rounded-xl border border-transparent font-semibold transition-all" onclick="setVendorType('', this)">All</button>
          <button class="vendor-type-btn text-xs px-3 py-2 rounded-xl border border-slate-200 bg-white text-slate-600 font-semibold transition-all" onclick="setVendorType('platform', this)">Platform</button>
          <button class="vendor-type-btn text-xs px-3 py-2 rounded-xl border border-slate-200 bg-white text-slate-600 font-semibold transition-all" onclick="setVendorType('api', this)">API</button>
          <button class="vendor-type-btn text-xs px-3 py-2 rounded-xl border border-slate-200 bg-white text-slate-600 font-semibold transition-all" onclick="setVendorType('in-person', this)">In-Person</button>
          <button class="vendor-type-btn text-xs px-3 py-2 rounded-xl border border-slate-200 bg-white text-slate-600 font-semibold transition-all" onclick="setVendorType('government', this)">Government</button>
          <button class="vendor-type-btn text-xs px-3 py-2 rounded-xl border border-slate-200 bg-white text-slate-600 font-semibold transition-all" onclick="setVendorType('financial', this)">Financial</button>
        </div>
      </div>
      <div id="v-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </div>

  </main>

  <!-- Entrepreneur Profile Modal -->
  <div id="e-modal" class="modal-bg fixed inset-0 bg-slate-900/80 z-50 flex items-center justify-center p-4 hidden" onclick="closeModal(event)">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-6 relative" onclick="event.stopPropagation()">
      <button onclick="document.getElementById('e-modal').classList.add('hidden')"
        class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 transition-colors text-2xl leading-none">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script>
    DIP.init();
    document.getElementById('nav-placeholder').innerHTML = DIP.navHTML('directory');

    // ── Stats ──
    const stats = DIP.getStats();
    document.getElementById('d-total').textContent = stats.totalEntrepreneurs;
    document.getElementById('d-pending').textContent = stats.pendingMatch;
    document.getElementById('d-incubating').textContent = stats.inIncubation;
    document.getElementById('d-graduated').textContent = stats.graduated;
    document.getElementById('tab-count-e').textContent = stats.totalEntrepreneurs;
    document.getElementById('tab-count-v').textContent = stats.totalVendors;

    // ── Main Tab Switch ──
    function switchMainTab(tab, btn) {
      const isE = tab === 'entrepreneurs';
      document.getElementById('panel-entrepreneurs').classList.toggle('hidden', !isE);
      document.getElementById('panel-vendors').classList.toggle('hidden', isE);
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.remove('active');
        b.classList.add('border-slate-200', 'bg-white', 'text-slate-600');
      });
      btn.classList.add('active');
      btn.classList.remove('border-slate-200', 'bg-white', 'text-slate-600');
      if (!isE) filterVendors();
    }

    // ── Entrepreneurs ──
    let allEntrepreneurs = DIP.getEntrepreneurs();

    function filterEntrepreneurs() {
      const q = document.getElementById('search-e').value.toLowerCase();
      const sector = document.getElementById('filter-sector').value;
      const status = document.getElementById('filter-status').value;
      const filtered = allEntrepreneurs.filter(e => {
        const matchQ = !q || [e.name, e.location, e.business, e.story, ...e.problems].join(' ').toLowerCase().includes(q);
        const matchS = !sector || e.sector === sector;
        const matchSt = !status || e.status === status;
        return matchQ && matchS && matchSt;
      });
      renderEntrepreneurs(filtered);
    }

    function renderEntrepreneurs(list) {
      const grid = document.getElementById('e-grid');
      const empty = document.getElementById('e-empty');
      if (list.length === 0) { grid.innerHTML = ''; empty.classList.remove('hidden'); return; }
      empty.classList.add('hidden');
      grid.innerHTML = list.map(e => {
        const badge = DIP.statusBadge(e.status);
        return `
          <div class="card-anim bg-white rounded-2xl p-5 shadow-sm border border-slate-100 hover:shadow-md transition-shadow cursor-pointer" onclick="openProfile('${e.id}')">
            <div class="flex items-start justify-between mb-3">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-amber-100 flex items-center justify-center font-bold text-amber-700 shrink-0">${e.name.charAt(0)}</div>
                <div>
                  <h3 class="font-bold text-slate-800 text-sm leading-tight">${e.name}</h3>
                  <p class="text-xs text-slate-400 mt-0.5">${e.age ? e.age + ' yrs · ' : ''}${DIP.sectorLabel(e.sector)}</p>
                </div>
              </div>
              <span class="text-[10px] font-semibold px-2 py-1 rounded-full border shrink-0 ${badge.color}">${badge.label}</span>
            </div>
            <p class="text-xs font-semibold text-slate-700 mb-1">${e.business}</p>
            <p class="text-xs text-slate-400 mb-3">📍 ${e.location}</p>
            <div class="flex flex-wrap gap-1 mb-3">
              ${e.problems.slice(0,2).map(p => `<span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full">${p}</span>`).join('')}
              ${e.problems.length > 2 ? `<span class="text-[10px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full">+${e.problems.length - 2} more</span>` : ''}
            </div>
            <div class="flex gap-2 pt-2 border-t border-slate-50">
              <a href="ai-match.html?id=${e.id}" onclick="event.stopPropagation()" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-900 font-semibold text-[11px] py-1.5 rounded-lg text-center transition-all">🤖 AI Match</a>
              <button onclick="event.stopPropagation();openProfile('${e.id}')" class="flex-1 border border-slate-200 text-slate-600 font-semibold text-[11px] py-1.5 rounded-lg hover:bg-slate-50 transition-all">View Profile</button>
            </div>
          </div>`;
      }).join('');
    }

    renderEntrepreneurs(allEntrepreneurs);

    // ── Entrepreneur Profile Modal ──
    function openProfile(id) {
      const e = allEntrepreneurs.find(x => x.id === id);
      if (!e) return;
      const badge = DIP.statusBadge(e.status);
      const resources = e.resources || {};

      document.getElementById('modal-content').innerHTML = `
        <div class="flex items-start gap-4 mb-6">
          <div class="w-16 h-16 rounded-2xl bg-amber-100 flex items-center justify-center text-2xl font-black text-amber-700 shrink-0">${e.name.charAt(0)}</div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <h2 class="text-xl font-black text-slate-900">${e.name}</h2>
              <span class="text-xs font-semibold px-2 py-0.5 rounded-full border ${badge.color}">${badge.label}</span>
            </div>
            <p class="text-sm text-slate-500 mt-1">${e.age ? e.age + ' yrs' : ''} ${e.gender ? '· ' + e.gender : ''}</p>
            <p class="text-sm text-slate-500">📍 ${e.location}</p>
          </div>
        </div>

        <div class="bg-amber-50 rounded-xl p-4 mb-4">
          <p class="text-xs font-bold text-amber-700 uppercase tracking-wider mb-1">${DIP.sectorLabel(e.sector)}</p>
          <p class="font-semibold text-slate-800">${e.business}</p>
        </div>

        ${e.story ? `
        <div class="mb-4">
          <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Their Story</p>
          <p class="text-sm text-slate-700 leading-relaxed">${e.story}</p>
        </div>` : ''}

        <div class="mb-4">
          <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Problems Identified</p>
          <ul class="space-y-1.5">
            ${e.problems.map(p => `<li class="text-sm text-slate-700 flex items-start gap-2"><span class="text-red-400 shrink-0 mt-0.5">•</span>${p}</li>`).join('')}
          </ul>
        </div>

        ${e.needs && e.needs.length > 0 ? `
        <div class="mb-4">
          <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Need Tags</p>
          <div class="flex flex-wrap gap-1.5">
            ${e.needs.map(n => `<span class="text-xs bg-blue-100 text-blue-700 px-2.5 py-1 rounded-full font-medium">${n}</span>`).join('')}
          </div>
        </div>` : ''}

        <div class="mb-6">
          <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Resources</p>
          <div class="flex gap-3 flex-wrap">
            <span class="text-xs px-2.5 py-1 rounded-full font-medium ${resources.phone ? 'bg-green-100 text-green-700' : 'bg-red-50 text-red-500'}">📱 ${resources.phone ? 'Has phone' : 'No phone'}</span>
            <span class="text-xs px-2.5 py-1 rounded-full font-medium ${resources.bankAccount ? 'bg-green-100 text-green-700' : 'bg-red-50 text-red-500'}">🏦 ${resources.bankAccount ? 'Has bank account' : 'No bank account'}</span>
            <span class="text-xs px-2.5 py-1 rounded-full font-medium ${resources.internet === 'good' ? 'bg-green-100 text-green-700' : resources.internet === 'limited' ? 'bg-amber-100 text-amber-700' : 'bg-red-50 text-red-500'}">🌐 Internet: ${resources.internet || 'unknown'}</span>
          </div>
        </div>

        <div class="text-xs text-slate-400 mb-6">
          Captured by <strong>${e.capturedBy}</strong> on ${e.capturedAt} · ID: ${e.id}
        </div>

        <a href="ai-match.html?id=${e.id}"
          class="w-full block bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold py-3 rounded-xl text-center transition-all">
          🤖 Run AI Match for ${e.name.split(' ')[0]}
        </a>`;

      document.getElementById('e-modal').classList.remove('hidden');
    }

    function closeModal(event) {
      document.getElementById('e-modal').classList.add('hidden');
    }

    // ── Vendors ──
    let currentVendorType = '';

    function setVendorType(type, btn) {
      currentVendorType = type;
      document.querySelectorAll('.vendor-type-btn').forEach(b => {
        b.classList.remove('active');
        b.classList.add('border-slate-200', 'bg-white', 'text-slate-600');
        b.classList.remove('border-transparent');
      });
      btn.classList.add('active');
      btn.classList.remove('border-slate-200', 'bg-white', 'text-slate-600');
      filterVendors();
    }

    function filterVendors() {
      const q = document.getElementById('search-v').value.toLowerCase();
      const vendors = DIP.getVendors();
      const filtered = vendors.filter(v => {
        const matchType = !currentVendorType || v.type === currentVendorType;
        const matchQ = !q || [v.name, v.description, ...v.tags, ...(v.sectors || [])].join(' ').toLowerCase().includes(q);
        return matchType && matchQ;
      });
      renderVendors(filtered);
    }

    function renderVendors(list) {
      document.getElementById('v-grid').innerHTML = list.map(v => {
        const badge = DIP.vendorTypeBadge(v.type);
        return `
          <div class="card-anim bg-white rounded-2xl p-5 shadow-sm border border-slate-100 hover:shadow-md transition-shadow">
            <div class="flex items-start justify-between mb-3">
              <div class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center font-bold text-slate-600 text-sm shrink-0">
                ${v.type === 'platform' ? '🏪' : v.type === 'api' ? '⚡' : v.type === 'government' ? '🏛️' : v.type === 'financial' ? '💰' : '🤝'}
              </div>
              <span class="text-[10px] font-bold px-2 py-1 rounded-full ${badge.color}">${badge.label}</span>
            </div>
            <h3 class="font-bold text-slate-800 mb-1">${v.name}</h3>
            <p class="text-xs text-slate-500 leading-relaxed mb-3">${v.description}</p>
            <div class="flex flex-wrap gap-1 mb-3">
              ${v.tags.slice(0,3).map(t => `<span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full">${t}</span>`).join('')}
            </div>
            ${v.impact ? `<div class="text-xs text-green-600 font-medium mb-3">✓ ${v.impact}</div>` : ''}
            <div class="bg-slate-50 rounded-lg p-2.5 text-xs text-slate-600">
              <span class="font-semibold text-slate-700">How to connect: </span>${v.connect}
            </div>
          </div>`;
      }).join('');
    }

    filterVendors();
  </script>
</body>
</html>
