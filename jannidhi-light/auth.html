<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sign in — JanNidhi Light</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @media (min-width: 900px)  { html { font-size: 17px; } }
  @media (min-width: 1280px) { html { font-size: 18px; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen">
<div id="nav"></div>

<main class="max-w-sm mx-auto px-4 py-14">
  <h1 class="text-2xl font-black text-stone-900" id="heading">Sign in</h1>
  <p class="text-sm text-stone-500 mt-1 mb-6">Only needed to manage your page — donors never need an account.</p>

  <div class="bg-white border border-stone-100 rounded-2xl p-5 space-y-3">
    <button id="google-btn" class="w-full border border-stone-300 hover:bg-stone-50 text-stone-700 font-semibold py-3 rounded-xl text-sm transition-all flex items-center justify-center gap-2">
      <svg viewBox="0 0 24 24" class="w-4 h-4"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.4H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.7Z"/><path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.1-4 1.1-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1C3.4 21.3 7.4 24 12 24Z"/><path fill="#FBBC05" d="M5.4 14.3c-.2-.7-.4-1.5-.4-2.3s.1-1.6.4-2.3V6.6H1.4A12 12 0 0 0 0 12c0 1.9.5 3.8 1.4 5.4l4-3.1Z"/><path fill="#EA4335" d="M12 4.8c1.7 0 3.3.6 4.5 1.7l3.4-3.4C17.9 1.2 15.2 0 12 0 7.4 0 3.4 2.7 1.4 6.6l4 3.1c.9-2.8 3.5-4.9 6.6-4.9Z"/></svg>
      Continue with Google
    </button>
    <div class="flex items-center gap-2 text-[10px] text-stone-300"><div class="flex-1 h-px bg-stone-200"></div>or<div class="flex-1 h-px bg-stone-200"></div></div>

    <div class="flex gap-1 bg-stone-100 rounded-xl p-1 text-sm font-semibold">
      <button id="tab-in"  class="flex-1 py-2 rounded-lg bg-white shadow-sm transition-all">Sign in</button>
      <button id="tab-up"  class="flex-1 py-2 rounded-lg text-stone-500 transition-all">Create account</button>
    </div>

    <form id="form" class="space-y-3" autocomplete="on">
      <label class="block text-xs font-semibold text-stone-500">Email
        <input id="email" type="email" required placeholder="you@example.com" autocomplete="email"
          class="mt-1 w-full border border-stone-200 rounded-xl px-3 py-3 text-base focus:outline-none focus:ring-2 focus:ring-stone-300">
      </label>
      <label class="block text-xs font-semibold text-stone-500">Password
        <input id="password" type="password" required minlength="6" autocomplete="current-password"
          class="mt-1 w-full border border-stone-200 rounded-xl px-3 py-3 text-base focus:outline-none focus:ring-2 focus:ring-stone-300">
      </label>
      <button id="submit" type="submit" class="w-full bg-stone-900 hover:bg-stone-800 active:scale-[0.99] text-white font-semibold py-3 rounded-xl text-sm transition-all">Sign in</button>
      <button id="forgot" type="button" class="w-full text-xs text-stone-400 hover:text-stone-600 underline text-center">Forgot password?</button>
      <p id="msg" class="text-xs text-center min-h-[1rem]"></p>
    </form>
  </div>
</main>

<script>
(async () => {
  JNL.init();
  const user = await JNL.getUser();
  document.getElementById('nav').innerHTML = JNL.navHTML('', user);
  const next = new URLSearchParams(location.search).get('next') || 'create.html';
  if (user) { location.href = next; return; }

  const $ = id => document.getElementById(id);
  const msg = (t, ok) => { $('msg').textContent = t; $('msg').className = 'text-xs text-center min-h-[1rem] ' + (ok ? 'text-emerald-600' : 'text-red-500'); };

  $('google-btn').onclick = () => JNL.signInWithGoogle();

  let mode = 'in';
  function setMode(m) {
    mode = m;
    $('tab-in').className = 'flex-1 py-2 rounded-lg transition-all ' + (m === 'in' ? 'bg-white shadow-sm' : 'text-stone-500');
    $('tab-up').className = 'flex-1 py-2 rounded-lg transition-all ' + (m === 'up' ? 'bg-white shadow-sm' : 'text-stone-500');
    $('heading').textContent = m === 'in' ? 'Sign in' : 'Create your account';
    $('submit').textContent = m === 'in' ? 'Sign in' : 'Create account';
    $('password').autocomplete = m === 'in' ? 'current-password' : 'new-password';
    $('forgot').classList.toggle('hidden', m === 'up');
    msg('');
  }
  $('tab-in').onclick = () => setMode('in');
  $('tab-up').onclick = () => setMode('up');
  $('forgot').onclick = async () => {
    const email = $('email').value.trim();
    if (!email) return msg('Enter your email above first, then tap "Forgot password?" again.');
    try { await JNL.sendPasswordReset(email); msg('If that email has an account, a reset link is on its way.', true); }
    catch (err) { msg(err.message); }
  };

  $('form').onsubmit = async (e) => {
    e.preventDefault();
    const email = $('email').value.trim(), password = $('password').value;
    $('submit').disabled = true;
    msg(mode === 'in' ? 'Signing in…' : 'Creating account…', true);
    try {
      if (mode === 'in') {
        const { error } = await JNL.signInWithPassword(email, password);
        if (error) throw error;
        location.href = next;
      } else {
        const { data, error } = await JNL.signUpWithPassword(email, password);
        if (error) throw error;
        if (data.session) location.href = next;
        else msg('Account created — check your email to confirm, then sign in.', true);
      }
    } catch (err) { msg(err.message); }
    $('submit').disabled = false;
  };
})();
</script>
</body>
</html>
