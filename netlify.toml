[build]
  publish = "."

# Service worker must always be revalidated, or installed PWAs get stuck on
# an old app shell after a deploy.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"
