<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DRIVE Provider</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="drive-config.js"></script>
  <script src="oesn-data.js"></script>
  <script src="oesn-auth.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #fafaf9; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .sheet { transform: translateY(100%); transition: transform 0.3s cubic-bezier(.32,.72,0,1); }
    .sheet.open { transform: translateY(0); }
    .overlay { display: none; }
    .overlay.show { display: block; }
    .card { background: white; border-radius: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  </style>
</head>
<body class="min-h-screen">

<div id="user-bar"></div>

<!-- Overlay -->
<div id="overlay" class="overlay fixed inset-0 bg-black/50 z-40" onclick="closeSheet()"></div>

<!-- ═══ SHEET: Update Referral Status ══════════════════════════════════════ -->
<div id="status-sheet" class="sheet fixed bottom-0 left-0 right-0 z-50 bg-white rounded-t-2xl max-h-[80vh] overflow-y-auto">
  <div class="w-12 h-1.5 bg-stone-300 rounded-full mx-auto mt-3"></div>
  <div class="flex items-center justify-between px-5 pt-3 pb-3 border-b border-stone-100">
    <div>
      <h3 class="text-base font-bold text-stone-900">Update Status</h3>
      <p id="ss-sub" class="text-xs text-stone-400 mt-0.5"></p>
    </div>
    <button onclick="closeSheet()" class="text-stone-400 p-1">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="px-5 pt-4 pb-10 space-y-3">
    <p class="text-xs font-semibold text-stone-500">Set new status</p>
    <div class="space-y-2" id="ss-options"></div>
    <textarea id="ss-note" rows="3" placeholder="Add a note (optional) — progress update, blocker, next step…"
      class="w-full bg-stone-100 rounded-xl px-3 py-2.5 text-sm placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-amber-400 resize-none"></textarea>
    <button onclick="submitStatusUpdate()"
      class="w-full bg-stone-900 hover:bg-stone-700 text-white font-bold py-3 rounded-xl text-sm transition-colors">
      Save Status
    </button>
  </div>
</div>

<!-- ═══ HEADER ══════════════════════════════════════════════════════════════ -->
<header class="bg-white border-b border-stone-200 px-4 py-3 flex items-center justify-between">
  <div>
    <div class="font-bold text-stone-900" id="prov-name">Provider Portal</div>
    <div class="text-xs text-stone-400" id="prov-service"></div>
  </div>
  <span class="bg-emerald-100 text-emerald-800 text-xs font-semibold px-2.5 py-1 rounded-full">Provider</span>
</header>

<!-- ═══ TABS ════════════════════════════════════════════════════════════════ -->
<nav class="bg-white border-b border-stone-100 flex sticky top-0 z-30">
  <button onclick="switchTab('active')" id="tab-btn-active"
    class="flex-1 py-3 text-sm font-semibold text-amber-700 border-b-2 border-amber-500 flex items-center justify-center gap-1.5 min-h-[44px]">
    Active <span id="cnt-active" class="bg-amber-100 text-amber-700 text-xs rounded-full px-1.5 py-0.5 leading-none"></span>
  </button>
  <button onclick="switchTab('rtc')" id="tab-btn-rtc"
    class="flex-1 py-3 text-sm font-semibold text-stone-400 border-b-2 border-transparent flex items-center justify-center gap-1.5 min-h-[44px]">
    RTC <span id="cnt-rtc" class="bg-stone-100 text-stone-500 text-xs rounded-full px-1.5 py-0.5 leading-none"></span>
  </button>
  <button onclick="switchTab('done')" id="tab-btn-done"
    class="flex-1 py-3 text-sm font-semibold text-stone-400 border-b-2 border-transparent flex items-center justify-center gap-1.5 min-h-[44px]">
    Done <span id="cnt-done" class="bg-stone-100 text-stone-500 text-xs rounded-full px-1.5 py-0.5 leading-none"></span>
  </button>
</nav>

<!-- ═══ CONTENT ════════════════════════════════════════════════════════════ -->
<main class="pb-10">
  <div id="tab-active" class="tab-content active p-4 space-y-3"></div>
  <div id="tab-rtc"    class="tab-content p-4 space-y-3"></div>
  <div id="tab-done"   class="tab-content p-4 space-y-3"></div>
</main>

<script>
// ─── State ───────────────────────────────────────────────────────────────────
let _ctx = null;
let _referrals = [];
let _activeRef = null; // referral being updated

const STATUS_FLOWS = {
  PENDING    : ['IN_PROGRESS', 'BLOCKED', 'CANCELLED'],
  IN_PROGRESS: ['RTC', 'BLOCKED', 'CANCELLED'],
  BLOCKED    : ['IN_PROGRESS', 'CANCELLED'],
  RTC        : ['COMPLETED', 'IN_PROGRESS'],
  COMPLETED  : [],
  CANCELLED  : [],
};

const STATUS_LABEL = {
  PENDING    : 'Pending',
  IN_PROGRESS: 'In Progress',
  RTC        : 'Ready to Close',
  BLOCKED    : 'Blocked',
  COMPLETED  : 'Completed',
  CANCELLED  : 'Cancelled',
};

const STATUS_COLOR = {
  PENDING    : 'bg-stone-100 text-stone-600',
  IN_PROGRESS: 'bg-blue-100 text-blue-800',
  RTC        : 'bg-amber-100 text-amber-800',
  BLOCKED    : 'bg-red-100 text-red-800',
  COMPLETED  : 'bg-emerald-100 text-emerald-800',
  CANCELLED  : 'bg-stone-100 text-stone-500',
};

// ─── Init ─────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  _ctx = await OESNAuth.guard('provider');
  if (!_ctx) return;
  OESNAuth.renderUserBar(_ctx, 'user-bar');

  // Show provider name
  if (_ctx.profile) {
    document.getElementById('prov-name').textContent = _ctx.profile.name || 'Provider Portal';
    document.getElementById('prov-service').textContent = _ctx.profile.organisations?.name || '';
  }

  await loadReferrals();
});

async function loadReferrals() {
  _referrals = await OESN.getReferrals();
  renderAll();
}

// ─── Rendering ────────────────────────────────────────────────────────────

function renderAll() {
  const active = _referrals.filter(r => ['PENDING','IN_PROGRESS','BLOCKED'].includes(r.status));
  const rtc    = _referrals.filter(r => r.status === 'RTC');
  const done   = _referrals.filter(r => ['COMPLETED','CANCELLED'].includes(r.status));

  document.getElementById('cnt-active').textContent = active.length || '';
  document.getElementById('cnt-rtc').textContent    = rtc.length   || '';
  document.getElementById('cnt-done').textContent   = done.length  || '';

  document.getElementById('tab-active').innerHTML = active.length
    ? active.map(refCard).join('') : emptyState('No active referrals');
  document.getElementById('tab-rtc').innerHTML = rtc.length
    ? [rtcBanner(), ...rtc.map(refCard)].join('') : emptyState('No referrals awaiting close');
  document.getElementById('tab-done').innerHTML = done.length
    ? done.map(refCard).join('') : emptyState('No completed referrals yet');
}

function emptyState(msg) {
  return `<div class="text-center py-16 text-stone-400 text-sm">${msg}</div>`;
}

function rtcBanner() {
  return `<div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-800 flex items-center gap-2 mb-1">
    <span>⏳</span>
    <span>These are marked Ready to Close — awaiting agent verification before commission is released.</span>
  </div>`;
}

function refCard(r) {
  const ent  = r.entrepreneurs?.name || 'Entrepreneur';
  const loc  = r.entrepreneurs?.location ? ` · ${r.entrepreneurs.location}` : '';
  const days = Math.floor((Date.now() - new Date(r.created_at)) / 86400000);
  const badge = STATUS_COLOR[r.status] || 'bg-stone-100 text-stone-600';
  const label = STATUS_LABEL[r.status] || r.status;
  const comm  = r.commission ? `₹${Number(r.commission).toLocaleString('en-IN')}` : '—';
  const dl    = r.deadline   ? new Date(r.deadline).toLocaleDateString('en-IN', {day:'numeric',month:'short'}) : '—';
  const canUpdate = STATUS_FLOWS[r.status]?.length > 0;

  return `<div class="card p-4">
    <div class="flex items-start justify-between mb-2">
      <span class="text-xs text-stone-500 bg-stone-100 rounded-full px-2 py-0.5">${ent}${loc}</span>
      <span class="text-xs font-semibold px-2 py-0.5 rounded-full ${badge}">${label}</span>
    </div>
    <p class="font-semibold text-stone-900">${r.service}</p>
    <div class="flex gap-4 mt-1 text-xs text-stone-400">
      <span>Day ${days}</span>
      <span>Deadline: ${dl}</span>
      <span class="text-amber-700 font-medium">Commission: ${comm}</span>
    </div>
    ${r.notes ? `<p class="text-xs text-stone-500 mt-2 line-clamp-2">${r.notes}</p>` : ''}
    ${canUpdate ? `<div class="flex gap-2 mt-3">
      <button onclick="openStatusSheet('${r.id}')"
        class="flex-1 border border-stone-300 text-stone-700 rounded-lg px-3 py-2 text-sm font-medium min-h-[40px]">
        Update Status
      </button>
      ${r.status === 'IN_PROGRESS' ? `<button onclick="openStatusSheet('${r.id}','BLOCKED')"
        class="border border-red-300 text-red-600 rounded-lg px-3 py-2 text-sm font-medium min-h-[40px]">
        Flag Blocker
      </button>` : ''}
    </div>` : ''}
  </div>`;
}

// ─── Tab switching ─────────────────────────────────────────────────────────

function switchTab(name) {
  ['active','rtc','done'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('active', t === name);
    const btn = document.getElementById('tab-btn-' + t);
    btn.classList.toggle('text-amber-700', t === name);
    btn.classList.toggle('border-amber-500', t === name);
    btn.classList.toggle('text-stone-400', t !== name);
    btn.classList.toggle('border-transparent', t !== name);
  });
}

// ─── Status sheet ──────────────────────────────────────────────────────────

function openStatusSheet(refId, preselect) {
  _activeRef = _referrals.find(r => r.id === refId);
  if (!_activeRef) return;
  document.getElementById('ss-sub').textContent = _activeRef.service + ' — ' + (_activeRef.entrepreneurs?.name || '');
  document.getElementById('ss-note').value = '';

  const next = STATUS_FLOWS[_activeRef.status] || [];
  document.getElementById('ss-options').innerHTML = next.map(s => `
    <label class="flex items-center gap-3 p-3 rounded-xl border cursor-pointer ${preselect === s ? 'border-amber-400 bg-amber-50' : 'border-stone-200'}">
      <input type="radio" name="ss-status" value="${s}" ${preselect === s ? 'checked' : ''} class="accent-amber-500">
      <div>
        <div class="font-semibold text-sm text-stone-900">${STATUS_LABEL[s]}</div>
        <div class="text-xs text-stone-400">${statusHint(s)}</div>
      </div>
    </label>`).join('');

  document.getElementById('overlay').classList.add('show');
  document.getElementById('status-sheet').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function statusHint(s) {
  return { IN_PROGRESS: 'Work is underway', RTC: 'Work done — request agent to verify', BLOCKED: 'Stuck — need help or more info', COMPLETED: 'Verified and closed', CANCELLED: 'No longer needed' }[s] || '';
}

function closeSheet() {
  document.getElementById('status-sheet').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
  document.body.style.overflow = '';
  _activeRef = null;
}

async function submitStatusUpdate() {
  if (!_activeRef) return;
  const statusEl = document.querySelector('input[name="ss-status"]:checked');
  if (!statusEl) { alert('Select a status first.'); return; }
  const newStatus = statusEl.value;
  const note = document.getElementById('ss-note').value.trim();

  const updates = { status: newStatus };
  if (note) updates.notes = (_activeRef.notes ? _activeRef.notes + '\n' : '') + `[${new Date().toLocaleDateString('en-IN')}] ${note}`;

  const updated = await OESN.updateReferral(_activeRef.id, updates);
  if (updated) {
    const idx = _referrals.findIndex(r => r.id === _activeRef.id);
    if (idx >= 0) _referrals[idx] = { ..._referrals[idx], ...updates };
    renderAll();
  }
  closeSheet();
}
</script>
</body>
</html>
