<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Forgotten Folklore Project — Digital Playbook</title>
<meta name="description" content="An interactive, page-turning digital edition of The Forgotten Folklore Project playbook: how a small team documented and published 65 children's picture books from Meghalaya and the Northeast.">
<link rel="icon" href="assets/mascot-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lemonada:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="pages-data.js"></script>
<script src="links-data.js"></script>

<style>
  :root {
    --maroon: #6B0F2A;
    --maroon-mid: #8B1535;
    --mustard: #F0B429;
    --paper: #FFFDF8;
    --ink: #1A1208;
    --forest: #2D5C3F;
    --navy: #050A30;
    --stage: #0A0E27;
    --stage-2: #0d1230;
    --nav-h: 52px;
    --progress-h: 3px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    height: 100vh;
    background: var(--stage);
    background-image: radial-gradient(ellipse 80% 60% at 50% 40%, var(--stage-2), var(--stage) 75%);
    color: var(--paper);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  a { color: inherit; }

  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  /* ---------- Nav ---------- */

  #nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--nav-h);
    z-index: 60;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    background: rgba(10, 14, 39, 0.86);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(240, 180, 41, 0.15);
  }

  #nav-logo {
    display: flex;
    align-items: center;
    gap: 8px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 6px 4px 4px;
    border-radius: 999px;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  #nav-logo:hover { background: rgba(240, 180, 41, 0.12); }
  #nav-logo .logo-badge {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
  }
  #nav-logo .logo-badge img {
    width: 92%;
    height: 92%;
    object-fit: contain;
    display: block;
  }
  #nav-logo .wordmark {
    font-family: 'Lemonada', cursive;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.02em;
    color: var(--mustard);
  }
  @media (max-width: 400px) {
    #nav-logo .wordmark { display: none; }
  }

  #nav-chapters {
    display: none;
    gap: 4px;
    list-style: none;
    margin: 0; padding: 0 8px;
    flex: 1;
    min-width: 0;
    justify-content: flex-start;
    overflow-x: auto;
    scrollbar-width: none;
    mask-image: linear-gradient(to right, transparent, black 16px, black calc(100% - 20px), transparent);
    -webkit-mask-image: linear-gradient(to right, transparent, black 16px, black calc(100% - 20px), transparent);
  }
  @media (min-width: 1100px) {
    #nav-chapters {
      justify-content: center;
      mask-image: none;
      -webkit-mask-image: none;
    }
  }
  #nav-chapters::-webkit-scrollbar { display: none; }

  @media (min-width: 640px) {
    #nav-chapters { display: flex; }
  }

  #nav-chapters a {
    display: block;
    white-space: nowrap;
    font-size: 0.72rem;
    font-weight: 500;
    text-decoration: none;
    color: rgba(255, 253, 248, 0.6);
    padding: 6px 10px;
    border-radius: 999px;
    cursor: pointer;
    transition: color 0.2s, background 0.2s;
  }
  #nav-chapters a:hover { color: var(--paper); }
  #nav-chapters a.active {
    color: var(--stage);
    background: var(--mustard);
    font-weight: 600;
  }

  #nav-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  #sound-toggle {
    background: none;
    border: 1px solid rgba(255, 253, 248, 0.25);
    color: rgba(255, 253, 248, 0.7);
    border-radius: 999px;
    width: 30px; height: 30px;
    font-size: 0.85rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  #sound-toggle:hover { border-color: var(--mustard); color: var(--mustard); }

  #nav-page-indicator {
    font-size: 0.72rem;
    color: rgba(255, 253, 248, 0.55);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  #nav-toc-btn {
    font-family: 'Inter', sans-serif;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--stage);
    background: var(--mustard);
    border: none;
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
  }
  #nav-toc-btn:hover { filter: brightness(1.08); }

  /* ---------- Progress bar ---------- */

  #progress-track {
    position: fixed;
    top: var(--nav-h);
    left: 0; right: 0;
    height: var(--progress-h);
    background: rgba(255, 255, 255, 0.06);
    z-index: 59;
  }
  #progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--maroon-mid), var(--mustard));
    transform-origin: left;
    transition: width 0.4s ease;
  }

  /* ---------- TOC overlay ---------- */

  #toc-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: #050614;
    backdrop-filter: blur(6px);
    overflow-y: auto;
    padding: calc(var(--nav-h) + 24px) 20px 40px;
  }
  #toc-overlay[hidden] { display: none; }

  #toc-inner {
    max-width: 900px;
    margin: 0 auto;
  }

  #toc-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 28px;
  }

  #toc-title {
    font-family: 'Lemonada', cursive;
    font-weight: 700;
    font-size: 1.7rem;
    color: var(--mustard);
    margin: 0;
  }

  #toc-close {
    background: none;
    border: 1px solid rgba(255, 253, 248, 0.3);
    color: var(--paper);
    border-radius: 999px;
    width: 36px; height: 36px;
    font-size: 1.1rem;
    cursor: pointer;
    line-height: 1;
  }
  #toc-close:hover { border-color: var(--mustard); color: var(--mustard); }

  #toc-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 2px;
  }
  @media (min-width: 700px) {
    #toc-grid { grid-template-columns: 1fr 1fr; gap: 2px 24px; }
  }

  .toc-row {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 12px 8px;
    text-decoration: none;
    border-radius: 8px;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    font: inherit;
    color: inherit;
    cursor: pointer;
    border-bottom: 1px solid rgba(255, 253, 248, 0.08);
    transition: background 0.15s;
  }
  .toc-row:hover { background: rgba(240, 180, 41, 0.1); }

  .toc-num {
    font-family: 'Lemonada', cursive;
    font-weight: 600;
    color: var(--mustard);
    min-width: 2.6em;
    font-size: 0.95rem;
  }
  .toc-name {
    flex: 1;
    font-size: 0.95rem;
    color: var(--paper);
  }
  .toc-page {
    font-size: 0.78rem;
    color: rgba(255, 253, 248, 0.45);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Book stage ---------- */

  #book-stage {
    position: fixed;
    top: calc(var(--nav-h) + var(--progress-h));
    left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 2600px;
    touch-action: pan-y;
  }

  #book-shadow {
    position: absolute;
    left: 50%; top: 50%;
    width: min(78vw, 980px);
    height: 42px;
    background: radial-gradient(ellipse, rgba(0,0,0,0.55), transparent 70%);
    transform: translate(-50%, 210px);
    pointer-events: none;
  }

  #book {
    position: relative;
    width: min(92vw, 1180px);
    aspect-ratio: 2 / 1;
    max-height: 78vh;
  }

  .card {
    position: absolute;
    inset: 0;
    border-radius: 5px;
    overflow: hidden;
    background: var(--paper);
    box-shadow: 0 22px 60px rgba(0, 0, 0, 0.55), 0 3px 10px rgba(0, 0, 0, 0.4);
  }

  .card img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: var(--paper);
  }

  .card.type-divider { box-shadow: 0 26px 70px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(240, 180, 41, 0.14); }

  /* merge cards: the cover's two halves paired with the title/blank pages
     into proper full-width spreads, so there's never a lone narrow "single"
     card mid-flip (that mismatch between a full-width flipping leaf and a
     half-width static card was the animation glitch). */
  .card.merge, .leaf-face.merge { display: flex; }
  .pane {
    flex: 1 1 50%;
    height: 100%;
    min-width: 0;
    background-repeat: no-repeat;
    background-color: var(--paper);
  }
  .pane.pane-whole { background-size: contain; background-position: center; }
  .pane.pane-crop-left { background-size: 200% 100%; background-position: left top; }
  .pane.pane-crop-right { background-size: 200% 100%; background-position: right top; }
  .pane + .pane { box-shadow: -1px 0 0 rgba(0, 0, 0, 0.08); }

  #card-current { z-index: 1; }

  /* ---------- Link overlays (QR codes / printed URLs made clickable) ---------- */

  .link-overlay {
    position: absolute;
    z-index: 11;
    cursor: pointer;
    border-radius: 4px;
    outline-offset: 2px;
  }
  .link-overlay:hover, .link-overlay:focus-visible {
    background: rgba(240, 180, 41, 0.22);
    box-shadow: 0 0 0 2px rgba(240, 180, 41, 0.6);
  }

  #links-btn {
    position: absolute;
    z-index: 12;
    left: 10px;
    bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(10, 14, 39, 0.85);
    color: var(--paper);
    border: 1px solid rgba(240, 180, 41, 0.35);
    border-radius: 999px;
    padding: 6px 12px 6px 8px;
    font-size: 0.72rem;
    font-weight: 600;
    cursor: pointer;
    backdrop-filter: blur(6px);
  }
  #links-btn:hover { border-color: var(--mustard); }
  #links-btn svg { width: 15px; height: 15px; flex-shrink: 0; }
  #links-btn[hidden] { display: none; }

  #links-panel {
    position: fixed;
    inset: 0;
    z-index: 110;
    background: #050614;
    overflow-y: auto;
    padding: calc(var(--nav-h) + 24px) 20px 40px;
  }
  #links-panel[hidden] { display: none; }
  #links-panel-inner { max-width: 640px; margin: 0 auto; }
  #links-panel-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  #links-panel-title {
    font-family: 'Lemonada', cursive;
    font-weight: 700;
    font-size: 1.4rem;
    color: var(--mustard);
    margin: 0;
  }
  #links-panel-close {
    background: none;
    border: 1px solid rgba(255, 253, 248, 0.3);
    color: var(--paper);
    border-radius: 999px;
    width: 36px; height: 36px;
    font-size: 1.1rem;
    cursor: pointer;
  }
  #links-panel-close:hover { border-color: var(--mustard); color: var(--mustard); }
  #links-panel-note {
    font-size: 0.8rem;
    color: rgba(255, 253, 248, 0.5);
    margin: 0 0 28px;
  }
  .link-card {
    display: flex;
    align-items: center;
    gap: 20px;
    background: rgba(255, 253, 248, 0.04);
    border: 1px solid rgba(255, 253, 248, 0.1);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 22px;
  }
  .link-card img {
    width: 88px;
    height: 88px;
    background: var(--paper);
    border-radius: 6px;
    flex-shrink: 0;
  }
  .link-card-body { min-width: 0; flex: 1; }
  .link-card-label {
    font-size: 0.95rem;
    color: var(--paper);
    margin: 0 0 8px;
  }
  .link-card-url {
    display: inline-block;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 0.78rem;
    color: var(--mustard);
    text-decoration: none;
    border-bottom: 1px solid rgba(240, 180, 41, 0.4);
  }
  .link-card-url:hover { border-color: var(--mustard); }

  @media (max-width: 480px) {
    .link-card { flex-direction: column; align-items: flex-start; }
    .link-card img { width: 120px; height: 120px; }
  }

  /* the flipping leaf: a full duplicate card with two faces */
  #flip-leaf {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: none;
    transform-style: preserve-3d;
    pointer-events: none;
  }
  #flip-leaf.flipping { display: block; }

  .leaf-face {
    position: absolute;
    inset: 0;
    border-radius: 5px;
    overflow: hidden;
    backface-visibility: hidden;
    background: var(--paper);
    box-shadow: 0 22px 60px rgba(0, 0, 0, 0.55);
  }
  .leaf-face img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: var(--paper);
  }
  .leaf-face.face-back { transform: rotateY(180deg); }

  .leaf-face::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(0,0,0,0.22), transparent 30%, transparent 70%, rgba(0,0,0,0.12));
    opacity: 0;
    transition: opacity 0.1s;
  }
  #flip-leaf.flipping .leaf-face::after { opacity: 1; }

  /* Pivoting at the card's own center (the CSS default origin) rather than
     an outer edge keeps the perspective foreshortening gentle — our source
     images are whole pre-composited spreads (not independent recto/verso
     page scans), so there's no real "spine" to hinge on; a wide off-center
     pivot made the leaf collapse to an odd sliver well before 90 degrees. */
  #flip-leaf.dir-forward.animate { transition: transform 0.85s cubic-bezier(0.45, 0.05, 0.35, 1); transform: rotateY(-180deg); }
  #flip-leaf.dir-back.animate { transition: transform 0.85s cubic-bezier(0.45, 0.05, 0.35, 1); transform: rotateY(180deg); }

  @media (prefers-reduced-motion: reduce) {
    #flip-leaf.animate { transition: opacity 0.2s linear !important; transform: none !important; }
  }

  /* click / tap zones */
  .nav-zone {
    position: absolute;
    top: 0; bottom: 0;
    width: 34%;
    z-index: 10;
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    opacity: 0;
    transition: opacity 0.2s;
  }
  #book:hover .nav-zone { opacity: 1; }
  .nav-zone.zone-prev { left: 0; justify-content: flex-start; }
  .nav-zone.zone-next { right: 0; justify-content: flex-end; }
  .nav-zone .chevron {
    margin: 0 8px;
    width: 38px; height: 38px;
    border-radius: 50%;
    background: rgba(10, 14, 39, 0.55);
    border: 1px solid rgba(240, 180, 41, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--mustard);
    backdrop-filter: blur(4px);
  }
  .nav-zone .chevron svg { width: 18px; height: 18px; }
  .nav-zone:disabled { display: none; }

  @media (hover: none) {
    .nav-zone { opacity: 0.55; }
  }

  #open-cover-hint {
    position: absolute;
    bottom: -46px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255, 253, 248, 0.55);
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
    pointer-events: none;
  }

  #caption {
    position: fixed;
    left: 0; right: 0;
    bottom: 14px;
    z-index: 20;
    text-align: center;
    font-size: 0.76rem;
    color: rgba(255, 253, 248, 0.5);
    padding: 0 60px;
    pointer-events: none;
  }
  #caption .chapter-tag {
    display: block;
    font-family: 'Lemonada', cursive;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--mustard);
    margin-bottom: 2px;
  }

  #page-counter {
    position: fixed;
    bottom: 16px;
    right: 16px;
    z-index: 50;
    background: rgba(10, 14, 39, 0.82);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(240, 180, 41, 0.2);
    color: var(--paper);
    font-size: 0.72rem;
    font-variant-numeric: tabular-nums;
    padding: 6px 12px;
    border-radius: 999px;
  }

  @media (max-width: 639px) {
    #book { width: 94vw; max-height: 68vh; }
    #caption { padding: 0 16px; bottom: 54px; }
    .nav-zone { width: 26%; }
  }
</style>
</head>
<body>

<nav id="nav" aria-label="Playbook navigation">
  <button id="nav-logo" type="button" aria-label="Back to the start">
    <span class="logo-badge"><img src="assets/mascot-icon.png" alt="" width="34" height="34"></span>
    <span class="wordmark">TFFP</span>
  </button>
  <ul id="nav-chapters"></ul>
  <div id="nav-right">
    <button id="sound-toggle" type="button" aria-pressed="true" aria-label="Mute page-turn sound">🔊</button>
    <span id="nav-page-indicator" aria-hidden="true">p. 1 / 110</span>
    <button id="nav-toc-btn" type="button" aria-haspopup="dialog" aria-controls="toc-overlay">Contents</button>
  </div>
</nav>

<div id="progress-track">
  <div id="progress-fill" role="progressbar" aria-label="Reading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
</div>

<div id="toc-overlay" role="dialog" aria-modal="true" aria-label="Table of contents" hidden>
  <div id="toc-inner">
    <div id="toc-header">
      <h2 id="toc-title">Table of Contents</h2>
      <button id="toc-close" type="button" aria-label="Close table of contents">✕</button>
    </div>
    <div id="toc-grid"></div>
  </div>
</div>

<main id="book-stage" aria-label="Playbook pages">
  <div id="book-shadow" aria-hidden="true"></div>
  <div id="book">
    <div id="card-current" class="card"></div>
    <div id="flip-leaf">
      <div class="leaf-face face-front"></div>
      <div class="leaf-face face-back"></div>
    </div>
    <button class="nav-zone zone-prev" id="zone-prev" aria-label="Previous page">
      <span class="chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></span>
    </button>
    <button class="nav-zone zone-next" id="zone-next" aria-label="Next page">
      <span class="chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>
    </button>
    <div id="open-cover-hint">Click, swipe, or press → to turn the page</div>
    <button id="links-btn" type="button" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      <span id="links-btn-label">Links on this page</span>
    </button>
  </div>
</main>

<p id="caption" aria-live="polite"></p>
<div id="page-counter" aria-hidden="true">1 / 110</div>

<div id="links-panel" role="dialog" aria-modal="true" aria-label="Links on this page" hidden>
  <div id="links-panel-inner">
    <div id="links-panel-header">
      <h2 id="links-panel-title">Links on this page</h2>
      <button id="links-panel-close" type="button" aria-label="Close">✕</button>
    </div>
    <p id="links-panel-note">Tap a code's original spot on the page to open it directly, or scan/tap one of these.</p>
    <div id="links-panel-list"></div>
  </div>
</div>

<script>
(function () {
  var DATA = window.PLAYBOOK_DATA;
  var navChaptersEl = document.getElementById('nav-chapters');
  var tocGrid = document.getElementById('toc-grid');
  var pageIndicator = document.getElementById('nav-page-indicator');
  var pageCounter = document.getElementById('page-counter');
  var tocOverlay = document.getElementById('toc-overlay');
  var progressFill = document.getElementById('progress-fill');
  var caption = document.getElementById('caption');
  var cardCurrent = document.getElementById('card-current');
  var flipLeaf = document.getElementById('flip-leaf');
  var faceFront = flipLeaf.querySelector('.face-front');
  var faceBack = flipLeaf.querySelector('.face-back');
  var openHint = document.getElementById('open-cover-hint');
  var zonePrev = document.getElementById('zone-prev');
  var zoneNext = document.getElementById('zone-next');
  var soundToggle = document.getElementById('sound-toggle');

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function pad3(n) { return String(n).padStart(3, '0'); }
  function srcFor(n) { return 'pages/' + pad3(n) + '.jpg'; }
  function chapterAnchor(num) { return 'chapter-' + num.replace(/\./g, ''); }
  function chapterForPage(n) {
    var current = null;
    for (var i = 0; i < DATA.chapters.length; i++) {
      if (n >= DATA.chapters[i].page) current = DATA.chapters[i];
      else break;
    }
    return current;
  }

  // ---- Build the reading sequence ----
  // Page 001.jpg is the flattened PRINT cover: back-cover art on its left
  // half, front-cover art on its right half (that's how wraparound covers
  // are laid out for print — back, spine, front, left to right). Showing
  // that whole flattened spread as the first thing a reader sees puts the
  // back cover before the front cover, which only makes sense on paper.
  // So instead: the front-cover half is cropped out and paired with the
  // title/copyright page (formerly a lone "single" card, which is what
  // caused the flip animation to glitch) to form one proper opening
  // spread; the back-cover half is cropped out and paired with the blank
  // closing page to form one proper closing spread. Every card in the
  // sequence is now a full two-up spread — no more narrow lone singles.
  var SEQUENCE = (function () {
    var byN = {};
    DATA.pages.forEach(function (p) { byN[p.n] = p; });
    var seq = [];
    seq.push({
      kind: 'merge', n: 1, type: 'cover',
      left: { src: srcFor(1), crop: 'right', alt: byN[1].alt },
      right: { src: srcFor(2), crop: null, alt: byN[2].alt }
    });
    DATA.pages.forEach(function (p) {
      if (p.n === 1 || p.n === 2 || p.n === 110) return;
      seq.push({ kind: 'single', n: p.n, type: p.type, src: srcFor(p.n), alt: p.alt });
    });
    seq.push({
      kind: 'merge', n: 110, type: 'cover',
      left: {
        src: srcFor(1), crop: 'left',
        alt: "Back cover: introductory blurb about the book's intent, "
           + "with the Sauramandala Foundation logo and the 'Nyapt' mascot signature."
      },
      right: { src: srcFor(110), crop: null, alt: byN[110].alt }
    });
    return seq;
  })();
  var TOTAL = SEQUENCE.length;
  function pageAt(i) { return SEQUENCE[i]; }
  function imagesFor(entry) {
    return entry.kind === 'merge' ? [entry.left.src, entry.right.src] : [entry.src];
  }

  // ---- Build nav chapter links (curated subset) ----
  DATA.navChapters.forEach(function (ch) {
    var li = document.createElement('li');
    var a = document.createElement('a');
    a.href = 'javascript:void(0)';
    a.textContent = ch.title;
    a.dataset.chapterNum = ch.num;
    a.addEventListener('click', function () { goToPageNumber(ch.page); });
    li.appendChild(a);
    navChaptersEl.appendChild(li);
  });

  // ---- Build full TOC overlay (all 21 chapters + cover) ----
  // Page numbers shown here are positions in the reading sequence (matching
  // what the nav indicator will show after the jump), not the original
  // per-file numbers — those diverge now that the cover/title/blank pages
  // were merged into two spreads instead of three separate cards.
  function seqPageNumber(n) {
    var idx = SEQUENCE.findIndex(function (p) { return p.n === n; });
    return idx >= 0 ? idx + 1 : n;
  }
  (function () {
    var coverBtn = document.createElement('button');
    coverBtn.type = 'button';
    coverBtn.className = 'toc-row';
    coverBtn.innerHTML = '<span class="toc-num">—</span><span class="toc-name">Cover</span><span class="toc-page">p. 1</span>';
    coverBtn.addEventListener('click', function () { goToPageNumber(1); closeToc(); });
    tocGrid.appendChild(coverBtn);
  })();
  DATA.chapters.forEach(function (ch) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'toc-row';
    btn.innerHTML =
      '<span class="toc-num">' + ch.num + '</span>' +
      '<span class="toc-name">' + ch.title + '</span>' +
      '<span class="toc-page">p. ' + seqPageNumber(ch.page) + '</span>';
    btn.addEventListener('click', function () { goToPageNumber(ch.page); closeToc(); });
    tocGrid.appendChild(btn);
  });
  (function () {
    var backBtn = document.createElement('button');
    backBtn.type = 'button';
    backBtn.className = 'toc-row';
    backBtn.innerHTML = '<span class="toc-num">—</span><span class="toc-name">Back cover</span><span class="toc-page">p. ' + TOTAL + '</span>';
    backBtn.addEventListener('click', function () { goToPageNumber(110); closeToc(); });
    tocGrid.appendChild(backBtn);
  })();

  // ---- Preload queue (current window eager, rest trickled in idly) ----
  var loaded = {};
  function preloadOne(src) {
    if (loaded[src]) return;
    loaded[src] = true;
    var im = new Image();
    im.src = src;
  }
  function preloadIndex(i) {
    if (i < 0 || i >= TOTAL) return;
    imagesFor(pageAt(i)).forEach(preloadOne);
  }
  function preloadAround(i) {
    for (var d = -2; d <= 3; d++) preloadIndex(i + d);
  }
  function idlePreloadRest() {
    var i = 0;
    function step(deadline) {
      var budget = deadline && deadline.timeRemaining ? deadline.timeRemaining() : 8;
      while (i < TOTAL && budget > 2) {
        preloadIndex(i);
        i++;
        budget -= 2;
      }
      if (i < TOTAL) schedule();
    }
    function schedule() {
      if ('requestIdleCallback' in window) requestIdleCallback(step, { timeout: 1000 });
      else setTimeout(function () { step(null); }, 300);
    }
    schedule();
  }

  // ---- Sound (tiny synthesized page-turn whoosh, user-triggered only) ----
  var soundOn = true;
  try { soundOn = localStorage.getItem('tffp-sound') !== 'off'; } catch (e) {}
  var audioCtx = null;
  function updateSoundBtn() {
    soundToggle.textContent = soundOn ? '🔊' : '🔇';
    soundToggle.setAttribute('aria-pressed', String(soundOn));
    soundToggle.setAttribute('aria-label', soundOn ? 'Mute page-turn sound' : 'Unmute page-turn sound');
  }
  updateSoundBtn();
  soundToggle.addEventListener('click', function () {
    soundOn = !soundOn;
    try { localStorage.setItem('tffp-sound', soundOn ? 'on' : 'off'); } catch (e) {}
    updateSoundBtn();
  });
  function playFlipSound() {
    if (!soundOn) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var ctx = audioCtx;
      var dur = 0.28;
      var bufferSize = ctx.sampleRate * dur;
      var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      var data = buffer.getChannelData(0);
      for (var i = 0; i < bufferSize; i++) {
        var t = i / bufferSize;
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2.2);
      }
      var src = ctx.createBufferSource();
      src.buffer = buffer;
      var filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1800, ctx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + dur);
      var gain = ctx.createGain();
      gain.gain.setValueAtTime(0.18, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
      src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      src.start();
    } catch (e) { /* audio not available; silently skip */ }
  }

  // ---- State ----
  var cur = 0; // 0-indexed into SEQUENCE
  var animating = false;

  function buildPane(paneData) {
    var div = document.createElement('div');
    div.setAttribute('role', 'img');
    div.setAttribute('aria-label', paneData.alt || '');
    div.className = 'pane ' + (paneData.crop === 'left' ? 'pane-crop-left' : paneData.crop === 'right' ? 'pane-crop-right' : 'pane-whole');
    div.style.backgroundImage = 'url(' + paneData.src + ')';
    return div;
  }

  function fillWithEntry(el, entry) {
    el.innerHTML = '';
    if (entry.kind === 'merge') {
      el.appendChild(buildPane(entry.left));
      el.appendChild(buildPane(entry.right));
    } else {
      var img = document.createElement('img');
      img.src = entry.src;
      img.alt = entry.alt || '';
      el.appendChild(img);
    }
  }

  function styleCard(el, entry) {
    el.className = 'card type-' + entry.type + (entry.kind === 'merge' ? ' merge' : '');
  }

  function renderCard(el, entry) {
    styleCard(el, entry);
    fillWithEntry(el, entry);
  }

  // ---- Clickable link overlays (QR codes / printed URLs) ----
  var linksBtn = document.getElementById('links-btn');
  var linksBtnLabel = document.getElementById('links-btn-label');
  var linksPanel = document.getElementById('links-panel');
  var linksPanelList = document.getElementById('links-panel-list');
  var currentPageLinks = [];

  function renderLinkOverlays(entry) {
    cardCurrent.querySelectorAll('.link-overlay').forEach(function (el) { el.remove(); });
    var data = (window.PAGE_LINKS && window.PAGE_LINKS[entry.n]) || [];
    currentPageLinks = data;

    data.forEach(function (link) {
      var a = document.createElement('a');
      a.className = 'link-overlay';
      a.href = link.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.setAttribute('aria-label', link.label);
      a.title = link.label;
      a.style.left = (link.box[0] * 100) + '%';
      a.style.top = (link.box[1] * 100) + '%';
      a.style.width = (link.box[2] * 100) + '%';
      a.style.height = (link.box[3] * 100) + '%';
      cardCurrent.appendChild(a);
    });

    linksBtn.hidden = data.length === 0;
    if (data.length > 0) {
      linksBtnLabel.textContent = data.length === 1 ? '1 link' : data.length + ' links';
    }
  }

  function openLinksPanel() {
    linksPanelList.innerHTML = '';
    currentPageLinks.forEach(function (link) {
      var card = document.createElement('div');
      card.className = 'link-card';
      card.innerHTML =
        '<img src="' + link.qr + '" alt="QR code for this link" width="88" height="88">' +
        '<div class="link-card-body">' +
          '<p class="link-card-label">' + link.label + '</p>' +
          '<a class="link-card-url" href="' + link.url + '" target="_blank" rel="noopener noreferrer">' + link.url + '</a>' +
        '</div>';
      linksPanelList.appendChild(card);
    });
    linksPanel.hidden = false;
  }
  function closeLinksPanel() { linksPanel.hidden = true; }
  linksBtn.addEventListener('click', openLinksPanel);
  document.getElementById('links-panel-close').addEventListener('click', closeLinksPanel);
  linksPanel.addEventListener('click', function (e) { if (e.target === linksPanel) closeLinksPanel(); });

  function updateChrome() {
    var p = pageAt(cur);
    var shown = cur + 1;
    pageIndicator.textContent = 'p. ' + shown + ' / ' + TOTAL;
    pageCounter.textContent = shown + ' / ' + TOTAL;
    progressFill.style.width = (cur / (TOTAL - 1) * 100) + '%';
    progressFill.setAttribute('aria-valuenow', Math.round(cur / (TOTAL - 1) * 100));

    var ch = chapterForPage(p.n);
    var navLinks = navChaptersEl.querySelectorAll('a');
    navLinks.forEach(function (a) {
      a.classList.toggle('active', !!ch && a.dataset.chapterNum === ch.num);
    });

    if (p.kind === 'merge') {
      caption.textContent = cur === 0 ? 'Cover' : 'Back cover';
    } else if (p.type === 'divider' && ch) {
      caption.innerHTML = '<span class="chapter-tag">Chapter ' + ch.num + '</span>' + ch.title;
    } else if (ch) {
      caption.innerHTML = ch.num + '. ' + ch.title;
    } else {
      caption.textContent = '';
    }

    zonePrev.disabled = cur === 0;
    zoneNext.disabled = cur === TOTAL - 1;
    openHint.style.display = cur === 0 ? 'flex' : 'none';

    renderLinkOverlays(p);
  }

  function jumpTo(index, opts) {
    opts = opts || {};
    index = Math.max(0, Math.min(TOTAL - 1, index));
    cur = index;
    renderCard(cardCurrent, pageAt(cur));
    updateChrome();
    preloadAround(cur + 1);
    if (!opts.silent) {
      cardCurrent.style.opacity = '0.001';
      requestAnimationFrame(function () {
        cardCurrent.style.transition = 'opacity 0.25s ease';
        cardCurrent.style.opacity = '1';
        setTimeout(function () { cardCurrent.style.transition = ''; }, 300);
      });
    }
  }

  function goToPageNumber(n) {
    var idx = SEQUENCE.findIndex(function (p) { return p.n === n; });
    if (idx >= 0) jumpTo(idx);
  }

  function goHome() { jumpTo(0); }

  function flip(direction) {
    if (animating) return;
    var targetIndex = cur + direction;
    if (targetIndex < 0 || targetIndex >= TOTAL) return;
    animating = true;

    var fromPage = pageAt(cur);
    var toPage = pageAt(targetIndex);

    faceFront.className = 'leaf-face face-front' + (fromPage.kind === 'merge' ? ' merge' : '');
    faceBack.className = 'leaf-face face-back' + (toPage.kind === 'merge' ? ' merge' : '');
    fillWithEntry(faceFront, fromPage);
    fillWithEntry(faceBack, toPage);

    // Underneath, pre-set the current card to the target so it's ready the instant the leaf clears.
    renderCard(cardCurrent, toPage);

    flipLeaf.className = 'flipping ' + (direction > 0 ? 'dir-forward' : 'dir-back');
    // Force reflow so the transition class change below actually animates.
    void flipLeaf.offsetWidth;

    playFlipSound();

    requestAnimationFrame(function () {
      flipLeaf.classList.add('animate');
    });

    var done = function () {
      flipLeaf.removeEventListener('transitionend', onTransitionEnd);
      flipLeaf.className = '';
      flipLeaf.style.transform = '';
      cur = targetIndex;
      updateChrome();
      preloadAround(cur + direction * 2);
      animating = false;
    };
    // transitionend bubbles from child elements too (e.g. the leaf-face
    // shading overlay's own short opacity transition) — only react to the
    // #flip-leaf transform transition finishing, not a bubbled child event.
    function onTransitionEnd(e) {
      if (e.target === flipLeaf && e.propertyName === 'transform') done();
    }

    if (reduceMotion) {
      setTimeout(done, 220);
    } else {
      flipLeaf.addEventListener('transitionend', onTransitionEnd);
      // Safety net in case transitionend doesn't fire (e.g. tab backgrounded).
      setTimeout(function () { if (animating) done(); }, 1100);
    }
  }

  function next() { flip(1); }
  function prev() { flip(-1); }

  zoneNext.addEventListener('click', next);
  zonePrev.addEventListener('click', prev);

  // ---- Keyboard ----
  document.addEventListener('keydown', function (e) {
    var tocOpen = !tocOverlay.hidden;
    var linksOpen = !linksPanel.hidden;
    if (e.key === 'Escape' && linksOpen) { closeLinksPanel(); return; }
    if (e.key === 'Escape' && tocOpen) { closeToc(); return; }
    if (e.key === 't' || e.key === 'T') { if (tocOpen) closeToc(); else openToc(); return; }
    if (tocOpen || linksOpen) return;

    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === 'Home') { jumpTo(0); }
    else if (e.key === 'End') { jumpTo(TOTAL - 1); }
  });

  // ---- Touch swipe ----
  var touchStartX = null, touchStartY = null;
  var bookEl = document.getElementById('book');
  bookEl.addEventListener('touchstart', function (e) {
    var t = e.changedTouches[0];
    touchStartX = t.clientX; touchStartY = t.clientY;
  }, { passive: true });
  bookEl.addEventListener('touchend', function (e) {
    if (touchStartX === null) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStartX;
    var dy = t.clientY - touchStartY;
    touchStartX = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      if (dx < 0) next(); else prev();
    }
  }, { passive: true });

  // ---- TOC open/close ----
  var lastFocused = null;
  function openToc() {
    lastFocused = document.activeElement;
    tocOverlay.hidden = false;
    document.getElementById('toc-close').focus();
  }
  function closeToc() {
    tocOverlay.hidden = true;
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  }
  document.getElementById('nav-logo').addEventListener('click', goHome);
  document.getElementById('nav-toc-btn').addEventListener('click', openToc);
  document.getElementById('toc-close').addEventListener('click', closeToc);
  tocOverlay.addEventListener('click', function (e) {
    if (e.target === tocOverlay) closeToc();
  });

  // ---- Init ----
  jumpTo(0, { silent: true });
  preloadAround(0);
  setTimeout(idlePreloadRest, 1200);
})();
</script>
</body>
</html>
