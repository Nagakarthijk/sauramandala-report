<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Reset password — JanNidhi</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen">
<div id="nav"></div>

<main class="max-w-sm mx-auto px-4 py-14">
  <h1 class="text-2xl font-black text-stone-900">Set a new password</h1>
  <p class="text-sm text-stone-500 mt-1 mb-6">You followed a reset link from your email. Choose a new password below.</p>

  <div class="bg-white border border-stone-100 rounded-2xl p-5 space-y-3">
    <label class="block text-xs font-semibold text-stone-500">New password
      <input id="password" type="password" minlength="6" autocomplete="new-password"
        class="mt-1 w-full border border-stone-200 rounded-xl px-3 py-3 text-base focus:outline-none focus:ring-2 focus:ring-stone-300">
    </label>
    <button id="save" class="w-full bg-stone-900 hover:bg-stone-800 text-white font-semibold py-3 rounded-xl text-sm transition-all">Save new password</button>
    <p id="msg" class="text-xs text-center min-h-[1rem]"></p>
  </div>
</main>

<script>
(async () => {
  JN.init();
  const user = await JN.getUser();
  document.getElementById('nav').innerHTML = JN.navHTML('', user);
  const $ = id => document.getElementById(id);
  const msg = (t, ok) => { $('msg').textContent = t; $('msg').className = 'text-xs text-center min-h-[1rem] ' + (ok ? 'text-emerald-600' : 'text-red-500'); };

  if (!user) msg('Open this page from the reset link in your email — this link works only right after that.');

  $('save').onclick = async () => {
    if ($('password').value.length < 6) return msg('Password must be at least 6 characters.');
    try {
      await JN.updatePassword($('password').value);
      msg('Password updated — redirecting…', true);
      setTimeout(() => location.href = 'create.html', 1200);
    } catch (err) { msg(err.message); }
  };
})();
</script>
</body>
</html>
