<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sign in — JanNidhi</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* Tailwind sizes are rem-based; scale the root so text reads comfortably on larger/high-DPI screens (e.g. Mac laptops) without touching every class. */
  @media (min-width: 900px)  { html { font-size: 17px; } }
  @media (min-width: 1280px) { html { font-size: 18px; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen">
<div id="nav"></div>

<main class="max-w-sm mx-auto px-4 py-14">
  <h1 class="text-2xl font-black text-stone-900" id="heading">Sign in</h1>
  <p class="text-sm text-stone-500 mt-1 mb-6" id="subhead">Only needed to <em>manage</em> a page — donors never need an account.</p>

  <div class="flex gap-1 mb-5 bg-stone-100 rounded-xl p-1 text-sm font-semibold">
    <button id="tab-in"  class="flex-1 py-2 rounded-lg bg-white shadow-sm transition-all">Sign in</button>
    <button id="tab-up"  class="flex-1 py-2 rounded-lg text-stone-500 transition-all">Create account</button>
  </div>

  <form id="form" class="bg-white border border-stone-100 rounded-2xl p-5 space-y-3" autocomplete="on">
    <label class="block text-xs font-semibold text-stone-500">Email
      <input id="email" type="email" required placeholder="you@example.com" autocomplete="email"
        class="mt-1 w-full border border-stone-200 rounded-xl px-3 py-3 text-base focus:outline-none focus:ring-2 focus:ring-stone-300">
    </label>
    <label class="block text-xs font-semibold text-stone-500">Password
      <input id="password" type="password" required minlength="6" autocomplete="current-password"
        class="mt-1 w-full border border-stone-200 rounded-xl px-3 py-3 text-base focus:outline-none focus:ring-2 focus:ring-stone-300">
    </label>
    <div id="turnstile-box" class="hidden flex justify-center"></div>
    <button id="submit" type="submit" class="w-full bg-stone-900 hover:bg-stone-800 active:scale-[0.99] text-white font-semibold py-3 rounded-xl text-sm transition-all">Sign in</button>
    <button id="forgot" type="button" class="w-full text-xs text-stone-400 hover:text-stone-600 underline text-center">Forgot password?</button>
    <p id="msg" class="text-xs text-center min-h-[1rem]"></p>
  </form>
</main>

<script>
(async () => {
  JN.init();
  const user = await JN.getUser();
  document.getElementById('nav').innerHTML = JN.navHTML('', user);
  const params = new URLSearchParams(location.search);
  const next = params.get('next') || 'create.html';
  const isOrgContext = params.get('context') === 'org';
  if (user) { location.href = next; return; }

  const $ = id => document.getElementById(id);
  const msg = (t, ok) => { $('msg').textContent = t; $('msg').className = 'text-xs text-center min-h-[1rem] ' + (ok ? 'text-emerald-600' : 'text-red-500'); };

  if (isOrgContext) {
    $('subhead').innerHTML = 'Create an account to <strong>register your party, group or collective</strong> and vouch for your workers.';
  }

  // CAPTCHA (Cloudflare Turnstile) — only renders once configured in config.js.
  // A skipped/unconfigured widget just means captchaToken is undefined, which
  // Supabase treats as "no CAPTCHA required" until you enable it server-side.
  let turnstileWidgetId = null, turnstileToken = null;
  function renderTurnstile() {
    if (!JN.CAPTCHA_ENABLED || typeof turnstile === 'undefined') return;
    $('turnstile-box').classList.remove('hidden');
    turnstileWidgetId = turnstile.render('#turnstile-box', {
      sitekey: JN_CONFIG.turnstileSiteKey,
      callback: (token) => { turnstileToken = token; },
      'expired-callback': () => { turnstileToken = null; }
    });
  }
  if (JN.CAPTCHA_ENABLED) {
    // Turnstile's script loads async — poll briefly until it's ready.
    const wait = setInterval(() => { if (typeof turnstile !== 'undefined') { clearInterval(wait); renderTurnstile(); } }, 100);
    setTimeout(() => clearInterval(wait), 5000);
  }

  let mode = 'in';
  function setMode(m) {
    mode = m;
    $('tab-in').className = 'flex-1 py-2 rounded-lg transition-all ' + (m === 'in' ? 'bg-white shadow-sm' : 'text-stone-500');
    $('tab-up').className = 'flex-1 py-2 rounded-lg transition-all ' + (m === 'up' ? 'bg-white shadow-sm' : 'text-stone-500');
    $('heading').textContent = m === 'in' ? 'Sign in' : (isOrgContext ? 'Register your organisation' : 'Create your account');
    $('submit').textContent = m === 'in' ? 'Sign in' : 'Create account';
    $('password').autocomplete = m === 'in' ? 'current-password' : 'new-password';
    $('forgot').classList.toggle('hidden', m === 'up');
    msg('');
  }
  $('tab-in').onclick = () => setMode('in');
  $('tab-up').onclick = () => setMode('up');
  if (isOrgContext) setMode('up'); // most org visitors here are registering for the first time

  $('form').onsubmit = async (e) => {
    e.preventDefault();
    if (JN.CAPTCHA_ENABLED && !turnstileToken) return msg('Please complete the human-check above.');
    const email = $('email').value.trim(), password = $('password').value;
    $('submit').disabled = true;
    msg(mode === 'in' ? 'Signing in…' : 'Creating account…', true);
    try {
      if (mode === 'in') {
        const { error } = await JN.signInWithPassword(email, password, turnstileToken);
        if (error) throw error;
        location.href = next;
      } else {
        const { data, error } = await JN.signUpWithPassword(email, password, turnstileToken);
        if (error) throw error;
        if (data.session) location.href = next;
        else msg('Account created — check your email to confirm, then sign in.', true);
      }
    } catch (err) {
      msg(err.message);
      if (turnstileWidgetId !== null) { turnstile.reset(turnstileWidgetId); turnstileToken = null; }
    }
    $('submit').disabled = false;
  };

  $('forgot').onclick = async () => {
    const email = $('email').value.trim();
    if (!email) return msg('Enter your email above first, then tap "Forgot password?" again.');
    try { await JN.sendPasswordReset(email, turnstileToken); msg('If that email has an account, a reset link is on its way.', true); }
    catch (err) { msg(err.message); }
  };
})();
</script>
</body>
</html>
